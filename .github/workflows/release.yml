# Pushing a tag like v0.10.0 builds BalatroCoop-0.10.0.zip (the mod folder,
# ready to extract into Mods) and publishes it as a GitHub release, with that
# version's section of CHANGELOG.md as the notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the mod version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version BalatroCoop/BalatroCoop.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match BalatroCoop.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the zip
        run: zip -r "BalatroCoop-$VERSION.zip" BalatroCoop

      - name: Release notes from the changelog
        run: |
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\nInstall: extract into `%%AppData%%\\Balatro\\Mods` (needs Lovely and Steamodded, see the README).\n' >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "BalatroCoop-$VERSION.zip" --title "Balatro Co-op $VERSION" --notes-file notes.md
